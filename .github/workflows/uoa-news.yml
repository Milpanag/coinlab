# Ενημερώνει καθημερινά τα νέα του ΕΚΠΑ και του Τμήματος Κοινωνιολογίας
name: Νέα ΕΚΠΑ
on:
  schedule:
    - cron: "0 5 * * *"   # κάθε μέρα στις 08:00 ώρα Ελλάδας (περίπου)
  workflow_dispatch:       # επιτρέπει χειροκίνητη εκτέλεση από την καρτέλα Actions
permissions:
  contents: write
concurrency:
  group: uoa-news
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_uoa_news.py
      - name: Αποθήκευση αλλαγών
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/uoa-news.json
          if git diff --cached --quiet; then echo "Καμία αλλαγή"; exit 0; fi
          git commit -m "Ενημέρωση νέων ΕΚΠΑ"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
